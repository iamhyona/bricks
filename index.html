:root{--g1:#dfe4ff;--g2:#9aa6dc;--gb:#33386e;--neon:#9fb4ff}

html,body{margin:0;height:100%;background:#0b0b0f;overflow:hidden}
body{height:100vh;height:100dvh;color:var(--g1);font-family:Silkscreen,Galmuri11,-apple-system,'Apple SD Gothic Neo',sans-serif;

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.bezel{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;border-radius:10px;background:#101016;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:8px;position:relative;overflow:hidden;
  background:#0a0c1d;box-shadow:inset 0 0 0 1px rgba(150,170,255,.25)}
.field{flex:1;min-height:0;position:relative;border-radius:6px;border:2px solid #3a3f80;box-shadow:0 0 14px rgba(150,170,255,.18);background:#0a0c1d;overflow:hidden} /* 단색 */
.screen>.phLvName{margin-top:-6px;padding-top:0}
/* HUD v2: 정보칸(.phBx) + 아이콘 버튼(.phIb) */
.hud{display:flex;gap:5px;height:58px;flex:0 0 auto}
.hud .phBx{flex:1 1 0;height:100%}
.hud .phBx.wide{flex:1.7 1 0}
.hud .phIb{flex:0 0 auto;height:100%;aspect-ratio:1/1;width:58px;padding:0}
.hud .phIb svg{width:22px;height:20px;display:block;overflow:visible}
.hud .phIb[disabled]{opacity:.35;pointer-events:none}
@media (max-width:440px){.hud{height:46px;gap:4px}.hud .phIb{width:46px}.hud .phIb svg{width:19px;height:17px}.hud .phBx{padding:7px 3px!important}.hud .phBx .phN{font-size:20px!important}}
canvas{display:block;width:100%;height:100%;touch-action:none}
/* overlay */
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(4,5,18,.88);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:5;text-align:center}
.ov.show{display:flex}
.sub{font:400 12px Silkscreen,monospace;color:var(--g2);letter-spacing:.2em}
.btn{width:min(260px,100%);padding:14px 10px;border:3px solid var(--gb);border-radius:10px;font:700 14px Silkscreen;letter-spacing:2px;color:var(--g1);background:#11132a;display:flex;flex-direction:column;align-items:center;gap:6px}
.btn:active{background:#252a5e}
.btn small{font:12px Galmuri11,sans-serif;letter-spacing:0;opacity:.75}
.btn.y{border-color:#a37f12;color:#ffd23f;background:#1f1a08;text-shadow:0 0 6px rgba(255,210,63,.5)}
.btn.easy{border-color:#0b6f93;color:#7fe0ff;background:#06202b}
.btn.hard{border-color:#8f1d36;color:#ff8aa0;background:#2a0c13}
.big{font:400 28px Silkscreen,monospace;letter-spacing:.15em;color:#fff;text-shadow:0 0 10px var(--neon),0 0 26px var(--neon);margin:4px 0}
.big.num{font:400 56px "Jersey 15",sans-serif;letter-spacing:.02em;line-height:1}
.msg{font:13px/1.7 Galmuri11,sans-serif;color:var(--g2)}
.row{display:flex;gap:8px;width:min(300px,100%)}
.row input{flex:1;min-width:0;height:52px;border:2px solid var(--gb);border-radius:12px;background:#080a1c;color:var(--g1);font:15px Galmuri11,sans-serif;padding:0 10px;outline:none;-webkit-user-select:text;user-select:text}
.row button{width:76px;border:2px solid #10b870;border-radius:12px;font:400 13px Silkscreen;letter-spacing:.15em;color:#9ff0c6;background:#12142a}
.row button:disabled{opacity:.6}
.x{font:700 22px Silkscreen;color:#bfc3c9;padding:6px 14px;margin-top:4px}
.list{width:min(310px,100%);max-height:52%;overflow:auto;border:3px solid var(--gb);border-radius:10px;background:#080a1c;text-align:left}
.list div{display:grid;grid-template-columns:22px minmax(0,1fr) auto 34px;gap:6px;align-items:center;padding:8px 10px;font:13px Galmuri11,sans-serif;border-bottom:1px solid rgba(150,170,255,.08)}
.list .r{color:var(--g2)} .list .s{font:700 13px Silkscreen;color:#fff} .list .m{font:400 14px "Jersey 15",sans-serif;color:var(--g2);text-align:right}
.list .me{background:rgba(150,170,255,.12)}
.list .em{display:block;text-align:center;color:var(--g2);padding:20px}
.credit{font:12px/1.7 Galmuri11,sans-serif;color:rgba(220,226,255,.45);margin-top:8px}
.help{font:12px/1.8 Galmuri11,sans-serif;color:var(--g2)}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(150,170,255,0);z-index:4}
.flash.go{animation:fl .9s}
.allc{position:absolute;inset:0;pointer-events:none;z-index:5}.allc .phPop{top:38%}
/* 지난번 고른 난이도 표시 */
html body #ovMode .phDiff.phDiff.phDiff.last{background:color-mix(in srgb,var(--b) 16%,#12142a)!important;box-shadow:0 0 14px color-mix(in srgb,var(--b) 40%,transparent)!important}

function step(b,k){

  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);beep(300,.03)}
  if(b.y>H+10){b.dead=1;return}
  // 패들
  if(b.vy>0&&b.y+b.r>=pad.y&&b.y+b.r<=pad.y+pad.h+6&&Math.abs(b.x-pad.x)<=pad.w/2+b.r){

}

function take(k){

    else if(d===3){ x.fillStyle='rgba(255,255,255,.4)'; for(let s=X+7;s<X+w-4;s+=8) for(let q=Y+8;q<Y+h-5;q+=6){ x.fillRect(s,q,2,2); } } // 점무늬
    else if(d===4){ x.fillStyle='rgba(255,255,255,.45)'; x.beginPath(); x.moveTo(cx,Y+5); x.lineTo(cx+7,cy); x.lineTo(cx,Y+h-5); x.lineTo(cx-7,cy); x.closePath(); x.fill(); } // 보석

    else { x.strokeStyle='rgba(0,0,0,.22)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(X+3,cy); x.lineTo(X+w-3,cy); x.moveTo(cx,Y+5); x.lineTo(cx,cy); x.moveTo(X+w*.25,cy); x.lineTo(X+w*.25,Y+h-4); x.moveTo(X+w*.75,cy); x.lineTo(X+w*.75,Y+h-4); x.stroke(); } // 벽돌 쌓기
    x.restore(); }
  else if(b.t==='S'){ x.fillStyle='rgba(60,70,80,.55)'; for(const [a,c] of [[5,6],[w-5,6],[5,h-6],[w-5,h-6]]){ x.beginPath(); x.arc(X+a,Y+c,1.6,0,7); x.fill(); }
    if(b.hp===1){ x.strokeStyle='rgba(0,0,0,.5)'; x.lineWidth=1.2; x.beginPath(); x.moveTo(X+w*.3,Y+3); x.lineTo(X+w*.5,cy); x.lineTo(X+w*.42,Y+h-3); x.stroke(); } }
  else if(b.t==='H'){ x.fillStyle='#fff'; for(let i=0;i<b.hp;i++){ x.beginPath(); x.arc(cx+(i-(b.hp-1)/2)*8,cy,2.6,0,7); x.fill(); } }
  else if(b.t==='B'){ x.fillStyle='#2a0c13'; x.beginPath(); x.arc(cx,cy+1,5.5,0,7); x.fill(); x.strokeStyle='#ffd23f'; x.lineWidth=1.5; x.beginPath(); x.moveTo(cx+3,cy-4); x.quadraticCurveTo(cx+6,cy-8,cx+8,cy-6); x.stroke(); x.fillStyle='#fff6a8'; x.fillRect(cx+7,cy-8,2,2); }
  else if(b.t==='?'){ x.fillStyle='#fff'; x.font='700 12px Silkscreen, monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('?',cx,cy+1); }

let STARS=null,SHOOT=null,shootAt=0;
function sky(){ const t=performance.now(); /* 단색 밤하늘 + 작은 별 + 가끔 유성 */
  if(!STARS||STARS.h!==H){ STARS=[]; STARS.h=H; for(let i=0;i<70;i++) STARS.push({x:Math.round(Math.random()*W),y:Math.round(Math.random()*H),r:Math.random()<.15?2:1,p:Math.random()*6.28,c:['#ffffff','#c9d0ff','#ffe9b8'][i%3]}); }
  for(const s of STARS){ x.globalAlpha=.3+.7*Math.abs(Math.sin(t/1400+s.p)); x.fillStyle=s.c; x.fillRect(s.x,s.y,s.r,s.r); } x.globalAlpha=1;
  if(!SHOOT&&t>shootAt){ SHOOT={x:W*.35+Math.random()*W*.65,y:Math.random()*H*.35,l:1}; shootAt=t+3500+Math.random()*4000; }
  if(SHOOT){ const s=SHOOT; x.save(); x.globalAlpha=Math.max(0,s.l); x.strokeStyle='#ffffff'; x.lineWidth=1.5; x.beginPath(); x.moveTo(s.x,s.y); x.lineTo(s.x+26,s.y-13); x.stroke(); x.globalAlpha=Math.max(0,s.l)*.4; x.beginPath(); x.moveTo(s.x+26,s.y-13); x.lineTo(s.x+46,s.y-23); x.stroke(); x.restore(); s.x-=5; s.y+=2.5; s.l-=.03; if(s.l<=0) SHOOT=null; } }
const PLANETS=[['#4aa8ff','#5ee07a'],['#ffb347','#e8892a'],['#ff6b6b','#d94848'],['#b88cff','#8f62e8'],['#5ee0c8','#2fb8a0'],['#ffd84d','#e0a000']];
const LVC={easy:{pt:5,top:'#fff6c8',bot:'#e0a000',glow:'#ffd84d',lamp:'#fff2a0'},normal:{pt:0,top:'#e6f7ff',bot:'#0a8fd0',glow:'#7fd9ff',lamp:'#7ff6ff'},hard:{pt:2,top:'#ffe0e6',bot:'#d42446',glow:'#ff6b86',lamp:'#ffc2cd'},master:{pt:3,top:'#f1e6ff',bot:'#7a34e0',glow:'#b88cff',lamp:'#e3d0ff'}}; // 레벨별 바·행성 색: EASY 노랑 · NORMAL 하늘(지구) · HARD 빨강 · MASTER 보라
const lv=()=>LVC[mode]||LVC.normal;
function planet(b){ const P=PLANETS[b.pt||0], R=b.r; /* 플랫한 행성 + 글로우 (멀티볼만 고리) */
  const ring=a=>{ x.save(); x.strokeStyle='#ffe2a8'; x.lineWidth=Math.max(2,R*.2); x.beginPath(); x.ellipse(b.x,b.y,R*1.6,R*.42,-.3,a,a+Math.PI); x.stroke(); x.restore(); };
  if(b.ring) ring(Math.PI);
  x.save(); x.shadowColor=P[0]; x.shadowBlur=R*1.3; x.fillStyle=P[0]; x.beginPath(); x.arc(b.x,b.y,R,0,7); x.fill(); x.shadowBlur=R*.6; x.fill(); x.restore();
  x.save(); x.beginPath(); x.arc(b.x,b.y,R,0,7); x.clip(); x.fillStyle=P[1];
  if((b.pt||0)===0){ x.beginPath(); x.ellipse(b.x-R*.3,b.y+R*.1,R*.45,R*.32,.5,0,7); x.ellipse(b.x+R*.5,b.y-R*.35,R*.32,R*.2,-.3,0,7); x.ellipse(b.x+R*.35,b.y+R*.65,R*.4,R*.18,0,0,7); x.fill(); } // 지구: 대륙
  else { x.fillRect(b.x-R,b.y-R*.15,R*2,R*.32); x.fillRect(b.x-R,b.y+R*.45,R*2,R*.22); }
  const sh=x.createRadialGradient(b.x-R*.4,b.y-R*.45,R*.1,b.x,b.y,R*1.05); sh.addColorStop(0,'rgba(255,255,255,.35)'); sh.addColorStop(.45,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,0,40,.42)'); x.fillStyle=sh; x.fillRect(b.x-R,b.y-R,R*2,R*2); // 살짝 입체감
  x.restore();
  x.strokeStyle='rgba(255,255,255,.45)'; x.lineWidth=1; x.beginPath(); x.arc(b.x,b.y,R-.5,0,7); x.stroke();
  x.fillStyle='rgba(255,255,255,.8)'; x.beginPath(); x.arc(b.x-R*.42,b.y-R*.42,R*.18,0,7); x.fill();
  if(b.ring) ring(0); }
const LBL={W:'WIDE',M:'MULTI',L:'LASER',S:'SLOW','2':'DOUBLE',P:'FIRE','+':'1 UP',C:'CATCH',K:'BOMB',N:'SHORT',F:'FAST',R:'REVERSE'};
let POP=null;
function drawDrop(d){ const w=64,h=20; /* 아이템: 아이콘 + 이름, 나쁜 아이템은 빨간 점선 */
  x.save(); x.shadowColor=d.bad?'#ff2a4a':d.c; x.shadowBlur=12; rr(d.x-w/2,d.y-h/2,w,h,h/2); x.fillStyle=d.bad?'#2a0b14':d.c; x.fill(); x.restore();
  x.save(); rr(d.x-w/2,d.y-h/2,w,h,h/2); x.lineWidth=2; if(d.bad){ x.strokeStyle='#ff4d6d'; x.setLineDash([4,3]); } else x.strokeStyle='rgba(255,255,255,.85)'; x.stroke(); x.restore();
  x.fillStyle=d.bad?'#ff4d6d':'rgba(10,12,29,.35)'; x.beginPath(); x.arc(d.x-w/2+10,d.y,8,0,7); x.fill();
  icon(d.k,d.x-w/2+10,d.y,1.05,'#ffffff');
  x.font='700 8px Silkscreen, monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillStyle=d.bad?'#ffb3c1':'#0a0c1d'; x.fillText(LBL[d.k]||d.t,d.x+9,d.y+.5); }
function aimLine(b){ const a=launchA(b); let px=b.x,py=b.y,vx=Math.sin(a),vy=-Math.cos(a),left=Math.min(220,H*.55); const pts=[[px,py]];
  for(let g=0;g<3&&left>0;g++){ let t=left; if(vx<0)t=Math.min(t,(px-b.r)/-vx); if(vx>0)t=Math.min(t,(W-b.r-px)/vx);
    const hb=bricks.reduce((m,br)=>{ /* 첫 벽돌에서 멈춤 (대략) */ for(let s=0;s<m;s+=3){ const qx=px+vx*s,qy=py+vy*s; if(qx>br.x-b.r&&qx<br.x+br.w+b.r&&qy>br.y-b.r&&qy<br.y+br.h+b.r) return s; } return m; },t);
    px+=vx*hb; py+=vy*hb; pts.push([px,py]); left-=hb; if(hb<t-.01) break; vx=-vx; }
  x.save(); x.strokeStyle='rgba(220,226,255,.55)'; x.lineWidth=1.4*U; x.setLineDash([2*U,5*U]); x.lineCap='round'; x.lineDashOffset=-performance.now()/60;
  x.beginPath(); x.moveTo(pts[0][0]+Math.sin(a)*(b.r+3),pts[0][1]-Math.cos(a)*(b.r+3)); for(let i=1;i<pts.length;i++) x.lineTo(pts[i][0],pts[i][1]); x.stroke(); x.restore(); }
function draw(){
  x.clearRect(0,0,W,H);
  sky(); // 우주 밤하늘 · 반짝이는 별 · 별똥별
  // 벽돌 (블록 질감 + 네온 발광)
  for(const b of bricks){ drawBrick(b); if(b.hit) b.hit--; }
  // 파편
  for(const p of parts){ x.globalAlpha=p.l/24; x.fillStyle=p.c; x.fillRect(p.x,p.y,2.5,2.5); } x.globalAlpha=1;
  // 아이템
  for(const d of drops) drawDrop(d);
  // 레이저 탄
  x.save(); x.shadowColor='#ff4d6d'; x.shadowBlur=8; x.fillStyle='#ffb3c1'; for(const s of shots) x.fillRect(s.x-1,s.y-6,2,7); x.restore();
  // 패들
  if(state!=='title'){
    const L=lv(), c=effects.L?'#ff4d6d':L.glow; // 바 색 = 레벨 색
    x.save(); x.shadowColor=c; x.shadowBlur=18; rr(pad.x-pad.w/2,pad.y,pad.w,pad.h,5); const pg=x.createLinearGradient(0,pad.y,0,pad.y+pad.h); pg.addColorStop(0,effects.L?'#ffd0da':L.top); pg.addColorStop(1,effects.L?'#ff6b86':L.bot); x.fillStyle=pg; x.fill(); x.restore();
    x.save(); x.fillStyle=L.lamp; x.shadowColor=L.lamp; x.shadowBlur=8; for(let i=-1;i<=1;i++){ x.beginPath(); x.arc(pad.x+i*pad.w*.3,pad.y+pad.h*.55,1.6,0,7); x.fill(); } x.restore(); // 우주선 불빛
    x.fillStyle='rgba(255,255,255,.5)'; x.fillRect(pad.x-pad.w/2+3,pad.y+1.5,pad.w-6,1.5);
    if(effects.L){ x.fillStyle='#ff4d6d'; x.fillRect(pad.x-pad.w/2+2,pad.y-3,4,3); x.fillRect(pad.x+pad.w/2-6,pad.y-3,4,3); }
  }
  // 공 방향선 (설정에서 켜기/끄기): 발사 전 공이 날아갈 길을 점선으로 · 벽에 한 번 튕기는 것까지
  if(PREF.guide&&mode==='easy'&&state==='play') for(const b of balls) if(b.stuck) aimLine(b);
  // 공
  for(const b of balls){ if(b.pt==null) b.pt=Math.floor(Math.random()*PLANETS.length); planet(b); } // 공 = 행성
  if(POP){ const a=(performance.now()-POP.at)/1100; if(a>=1) POP=null; else { const yy=pad.y-72-a*26; window.phPopDraw&&phPopDraw(x,POP.t,W/2,yy,20*U,POP.bad?'warn':'item',1-a*a); } } /* 아이템 이름: 공통 팝업 (d2 · 아이템 분홍 / 나쁜 아이템 빨강) */
  // 남은 효과 표시
  const now=performance.now(); let ex=6;
  for(const k in effects){ const it=ITEMS.find(i=>i.k===k); if(!it)continue; const left=Math.ceil((effects[k]-now)/1000);
    icon(k,ex+8,11,1.1,it.c); x.fillStyle=it.c; x.font='400 '+(14*U).toFixed(1)+'px "Jersey 15", sans-serif'; x.textAlign='left'; x.textBaseline='middle'; x.fillText(left,ex+17,12); ex+=38; }
  if(state==='play'&&balls.some(b=>b.stuck)){ x.fillStyle='rgba(220,226,255,'+(.5+.5*Math.sin(now/250))+')'; x.font='700 9px Silkscreen, monospace'; x.textAlign='center'; x.fillText('TAP TO LAUNCH',W/2,pad.y-40); }
  if(state==='clear'&&window.phPopDraw){ phPopDraw(x,'STAGE CLEAR',W/2,H/2,28*U,'stage'); phPopDraw(x,'STAGE '+String(stageN).padStart(2,'0'),W/2,H/2+30*U,11*U,'stage'); }
}
